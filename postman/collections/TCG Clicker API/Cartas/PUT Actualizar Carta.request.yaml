$kind: http-request
name: PUT Actualizar Carta
method: PUT
url: '{{base_url}}?recurso=cartas'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "id": 1,
      "rareza": "rara"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response is valid JSON", function () {
          pm.response.to.be.json;
      });
